# PaperTeam 的 SearXNG 配置模板（M6.3 Web Search；官方镜像挂载为 /etc/searxng/settings.yml）
#
# 依据 M6.1 源码分析（docs/research/M6.1_SEARCH_RAG_OSS_ANALYSIS.md §3）：
#   * use_default_settings 引擎收敛 —— 只保留大陆直连可用的 bing + baidu。
#     M9.2 live smoke 实测：`use_default_settings: true` 时上游默认引擎
#     （google cse 等）仍在跑——大陆网络超时拖慢每次查询并恒定
#     unresponsive_engines → degraded；keep_only 才是真正的白名单语义；
#   * search.formats 必须显式加 json —— 上游默认只有 html，format=json 未启用时
#     GET /search 返回 403（PaperTeam 会如实报 provider_misconfigured）；
#   * server.limiter 关闭 —— 单机内网部署；若开启且无 valkey 白名单，
#     JSON API 请求限 4 次/小时/IP（searx/botdetection/ip_limit.py API_MAX=4）。
#
# engine 名（bing / baidu …）是 SearXNG 上游真实模块名，与
# https://github.com/searxng/searxng/blob/master/searx/settings.yml 一致。

use_default_settings:
  engines:
    keep_only:
      - bing
      - baidu

server:
  # 内网部署：limiter 关闭（开启会限 JSON API 4 次/小时/IP）
  limiter: false
  # 本地随机 secret（compose 内网单实例；请勿暴露公网——公网部署请改强随机值并开 limiter）
  secret_key: "paperteam-searxng-local-secret"

search:
  # PaperTeam 只消费 JSON API；html 保留给人工浏览器排障
  formats:
    - html
    - json

engines:
  # 大陆直连主力：Bing（上游自带 cn.bing.com 覆盖注释，此处启用覆盖）
  - name: bing
    disabled: false
    base_url: https://cn.bing.com
  # 大陆直连主力：百度（JSON 接口；CAPTCHA 时 SearXNG 自动挂起 1h 换源）
  - name: baidu
    disabled: false

# 有代理时可启用境外引擎（ socks5h 走本地代理出口；keep_only 需同步加引擎名）：
# outgoing:
#   proxies:
#     all://:
#       - socks5h://127.0.0.1:7890
