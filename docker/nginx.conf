# PaperTeam web（nginx）：Frontend 静态资源 + 同源反向代理（M5.5）。
# 用户只访问这一个地址；Backend :3000 不对外发布（compose 只在内部网络可达）。

upstream paperteam_backend {
  server backend:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PDF 上传（base64 JSON）与 LaTeX zip 导入：与 Backend MAX_BODY 同量级
  client_max_body_size 64m;

  # 前端路由（React Router）：未知路径回落 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静态资源：内容 hash 文件名，长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API / 健康 / 就绪：同源转发；SSE（/api/runs/:id/events）需要关闭缓冲、放长超时
  location ~ ^/(api|health|ready)(/|$) {
    proxy_pass http://paperteam_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }
}
