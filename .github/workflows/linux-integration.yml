name: Linux Integration

# M12.2.5 Linux 集成验收：真实 docling 工具链（重依赖：torch CPU 栈 + HF 模型
# 下载）不进每 push 的 CI（ci.yml 保持轻量），在 main push + 手动触发时执行：
#   native  ：ubuntu runner pip install docling → 真实 PDF→docling→ingestion
#             全链测试（backend/test/ingestion/doclingReal.smoke.test.ts）
#   docker  ：backend-docling 镜像构建（独立 venv）→ 容器内直接驱动
#             parse_document_docling.py → 结构化 JSON + 子进程干净退出（无僵尸）
#             + 模型缓存持久化 volume 验证

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linux-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docling-native:
    name: docling native（ubuntu runner · 真实全链）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # M15.3.3 B3.1：显式直连官方源（runner 在海外）。此前本 job 不设 HF_ENDPOINT，
      # 但 doclingReal.smoke.test.ts 会在未设置时注入 hf-mirror.com，并经 DoclingParser
      # 的 env: { ...process.env } 传入 Python 子进程——实际下载端点是镜像站，与旧注释
      # “直连 HuggingFace”矛盾（取证：run 39921420556 attempt 1 于 152s 断连、
      # attempt 2 于 880s 超时，均为镜像下载）。显式设置后测试的 undefined 分支不再
      # 注入镜像；本机（国内网络）不设置时的镜像缺省行为保持不变。
      HF_ENDPOINT: https://huggingface.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: npm --prefix backend ci --no-audit --no-fund
      - name: Install docling（torch CPU 栈）
        run: |
          python3 --version
          python3 -m pip install --user --break-system-packages "docling>=2,<3" "pymupdf>=1.24,<2" \
            || python3 -m pip install --user "docling>=2,<3" "pymupdf>=1.24,<2"
          python3 -c "import docling; print('docling', docling.__version__)"
          echo "DOCLING_VERSION=$(python3 -c 'import docling; print(docling.__version__)')" >> "$GITHUB_ENV"
      - name: 诊断 HF 端点与模型缓存路径（脱敏：仅主机名/路径，无 token/查询串）
        run: |
          python3 -c 'import huggingface_hub; print("huggingface_hub", huggingface_hub.__version__)'
          # 库内解析结果即子进程实际使用的下载端点与缓存目录（证明 huggingface_hub 读取 HF_ENDPOINT）
          python3 -c 'from urllib.parse import urlparse; from huggingface_hub import constants; e = getattr(constants, "ENDPOINT", ""); print("resolved constants.ENDPOINT host =", urlparse(e).hostname if e else "<n/a>")'
          python3 -c 'from huggingface_hub import constants; print("resolved constants.HF_HOME =", getattr(constants, "HF_HOME", "<n/a>")); print("resolved constants.HF_HUB_CACHE =", getattr(constants, "HF_HUB_CACHE", "<n/a>"))'
          echo "env HF_HOME = ${HF_HOME:-<unset>}"
          echo "env HF_HUB_CACHE = ${HF_HUB_CACHE:-<unset>}"
          echo "--- pre-smoke cache dirs ---"
          du -sh ~/.cache/huggingface ~/.cache/docling 2>/dev/null || true
          find ~/.cache/huggingface ~/.cache/docling -maxdepth 3 2>/dev/null | head -20 || true
      - name: HF 模型缓存（key 含 docling 版本；仅模型目录，不含 token/凭据文件）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/docling
          key: docling-models-v1-${{ runner.os }}-${{ env.DOCLING_VERSION }}
      - name: Run real docling ingestion smoke（PDF → docling → blocks → IngestionService）
        env:
          CI: "true"
        run: |
          set +e
          log="$(mktemp)"
          npm --prefix backend test -- doclingReal 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          # M15.3.3 B3.3：仅对可确认的瞬时网络下载错误做一次有界重试（attempt 2/2，打印
          # 缓存状态）。匹配集 = 传输层断连/重置/读超时 + 解析超时（首次解析超时发生在
          # 模型下载阶段，DoclingParser 自身错误文案即注明“重试会使用已缓存模型”）。
          # 解析错误 / schema 错误 / 表格图块断言失败不在匹配集内；即便误触发重试，
          # 确定性失败第二次同样失败并真实退出——不吞错、不降级 PyMuPDF、不改超时。
          if grep -Eq "Server disconnected|Connection reset|RemoteDisconnected|IncompleteRead|Read timed out|ConnectionError|Connection aborted|Temporary failure in name resolution|Network is unreachable|解析超时" "$log"; then
            echo "::warning::docling smoke 疑似瞬时网络下载失败（rc=$rc，attempt 1/2 失败）——按 M15.3.3 B3.3 重试一次，缓存状态："
            du -sh ~/.cache/huggingface/hub 2>/dev/null || true
            find ~/.cache/huggingface/hub -maxdepth 2 2>/dev/null | head -10 || true
            npm --prefix backend test -- doclingReal
            exit "$?"
          fi
          exit "$rc"
      - name: Post-smoke 模型缓存观测（大小/路径可追溯）
        if: always()
        run: |
          echo "--- post-smoke cache dirs ---"
          du -sh ~/.cache/huggingface ~/.cache/docling 2>/dev/null || true
          find ~/.cache/huggingface/hub ~/.cache/docling -maxdepth 3 2>/dev/null | head -20 || true

  docling-docker:
    name: docling docker（backend-docling 镜像 · 子进程生命周期）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend-docling image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend-docling
          push: false
          load: true
          tags: paperteam-backend-docling:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke（docling venv + 工具脚本 → 结构化 JSON + 干净退出 + 模型缓存落 volume）
        run: |
          # 镜像内 docling 可导入（venv 完整性）
          docker run --rm paperteam-backend-docling:ci /opt/paperteam-docling-venv/bin/python -c "import docling; print('docling', docling.__version__)"
          # 带模型缓存 volume 启动后端（脚本级驱动工具；不动模型配置）
          docker run -d --name pt-docling \
            -e PAPERTEAM_TEST_RUNTIME=scripted \
            -v paperteam-hf-ci:/data/hf-cache \
            paperteam-backend-docling:ci
          sleep 5
          # 基线 python 进程数（后端启动后；经 /proc 计数——slim 镜像无 ps）
          count_python() {
            docker exec pt-docling sh -c 'n=0; for f in /proc/[0-9]*/comm; do read -r c < "$f" 2>/dev/null || continue; case "$c" in python*) n=$((n+1));; esac; done; echo $n'
          }
          baseline=$(count_python)
          echo "baseline python processes: $baseline"
          # docker cp fixture + 直接驱动解析工具（与 DoclingParser.execFile 同一入口）。
          # 失败时先 dump 结构化错误 JSON 再退出——错误信息只在该文件里
          docker cp backend/test/fixtures/pdf/attention.pdf pt-docling:/tmp/attention.pdf
          set +e
          docker exec pt-docling /opt/paperteam-docling-venv/bin/python /app/backend/tools/parse_document_docling.py /tmp/attention.pdf --figures-dir=/tmp/figs > /tmp/docling-out.json
          rc=$?
          set -e
          echo "--- docling tool output (rc=$rc) ---"
          cat /tmp/docling-out.json || true
          echo ""
          if [ "$rc" -ne 0 ]; then
            echo "::error::docling 解析工具退出码 $rc（结构化错误见上方 JSON）"
            docker logs --tail 30 pt-docling || true
            exit 1
          fi
          # 结构化产物断言：ok / parser=docling / blocks 非空
          jq -e '.ok == true and .parser.id == "docling" and (.blocks | length) > 50' /tmp/docling-out.json
          jq -r '"blocks=\(.blocks|length) pages=\(.pageCount // 0) parser=\(.parser.version)"' /tmp/docling-out.json
          # 子进程干净退出：解析结束后无残留 python 进程（baseline 与运行中一致）
          after=$(count_python)
          echo "post-parse python processes: $after"
          if [ "$after" -gt "$baseline" ]; then
            echo "::error::docling 子进程未退出（python 进程 $baseline → $after）"
            docker exec pt-docling sh -c 'for f in /proc/[0-9]*/cmdline; do tr "\0" " " < "$f" 2>/dev/null && echo; done' || true
            exit 1
          fi
          # 模型缓存确实落在 /data/hf-cache（volume 持久化路径，非容器可写层）
          docker exec pt-docling sh -c "test -d /data/hf-cache && find /data/hf-cache -maxdepth 3 -type d | head -5"
          docker stop -t 45 pt-docling
          docker volume rm paperteam-hf-ci || true
